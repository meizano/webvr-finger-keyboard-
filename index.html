<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebVR 12-Button Finger Segment Typing - Landing Page</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .ui-overlay {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      background: rgba(15, 23, 42, 0.88);
      padding: 16px 24px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
      backdrop-filter: blur(8px);
      max-width: 620px;
      width: 90%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    h1 { margin: 0 0 8px 0; font-size: 1.4rem; color: #38bdf8; }
    p { margin: 0 0 12px 0; font-size: 0.92rem; color: #94a3b8; line-height: 1.4; }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }
    .btn:hover {
      background: linear-gradient(135deg, #0369a1, #075985);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="ui-overlay">
    <h1>12-Button Finger Segment Typing VR/MR</h1>
    <p>Type using 12 buttons mapped across right-hand finger segments (A-L). Features AR.js Webcam Passthrough, Floating 3D Hand, Synchronized QWERTY Screen & 3s Gaze Control.</p>
    <div class="btn-group">
      <a href="cardboard.html" class="btn">Cardboard & PC Mode (Webcam / Gaze 3s)</a>
      <a href="webxr.html" class="btn">Native WebXR Mode (Headset / Quest)</a>
    </div>
  </div>

  <a-scene background="color: #090d16">
    <a-assets>
      <mixin id="card-panel" geometry="primitive: plane; width: 2.2; height: 1.4" material="shader: flat; color: #1e293b; transparent: true; opacity: 0.9"></mixin>
    </a-assets>

    <!-- Lighting -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; color: #38bdf8; intensity: 0.6" position="-1 4 2"></a-entity>

    <!-- Floor Grid -->
    <a-grid position="0 0 0" rotation="0 0 0" material="color: #1e293b; opacity: 0.5"></a-grid>

    <!-- 3D Title -->
    <a-entity position="0 2.8 -3">
      <a-text value="12-BUTTON FINGER TYPING VR/MR" align="center" color="#38bdf8" width="6" font="dejavu"></a-text>
      <a-text value="Select VR / MR Mode Below (Gaze 3s / Click)" align="center" color="#94a3b8" width="4" position="0 -0.4 0" font="dejavu"></a-text>
    </a-entity>

    <!-- Portal 1: Cardboard & PC Mode -->
    <a-entity position="-1.5 1.5 -2.5" rotation="0 20 0">
      <a-entity mixin="card-panel" class="clickable" onclick="window.location.href='cardboard.html'"></a-entity>
      <a-box position="0 0 -0.02" width="2.25" height="1.45" depth="0.02" color="#0ea5e9" opacity="0.3"></a-box>
      <a-text value="Cardboard & PC Mode\n(AR.js Passthrough & Gaze 3s)" align="center" color="#ffffff" width="3.5" position="0 0.3 0.05" font="dejavu"></a-text>
      <a-text value="Uses Webcam Passthrough,\nFloating Hand, Gaze 3s & QWERTY." align="center" color="#cbd5e1" width="3" position="0 -0.2 0.05" font="dejavu" scale="0.8 0.8 0.8"></a-text>
      <a-plane width="2.2" height="1.4" position="0 0 0.03" material="opacity: 0" class="clickable" onclick="window.location.href='cardboard.html'"></a-plane>
    </a-entity>

    <!-- Portal 2: Native WebXR Mode -->
    <a-entity position="1.5 1.5 -2.5" rotation="0 -20 0">
      <a-entity mixin="card-panel" class="clickable" onclick="window.location.href='webxr.html'"></a-entity>
      <a-box position="0 0 -0.02" width="2.25" height="1.45" depth="0.02" color="#6366f1" opacity="0.3"></a-box>
      <a-text value="Native WebXR Mode\n(Meta Quest / VR Headset)" align="center" color="#ffffff" width="3.5" position="0 0.3 0.05" font="dejavu"></a-text>
      <a-text value="Uses WebXR Hand API,\nPassthrough MR & Synchronized QWERTY." align="center" color="#cbd5e1" width="3" position="0 -0.2 0.05" font="dejavu" scale="0.8 0.8 0.8"></a-text>
      <a-plane width="2.2" height="1.4" position="0 0 0.03" material="opacity: 0" class="clickable" onclick="window.location.href='webxr.html'"></a-plane>
    </a-entity>

    <!-- Camera Rig with 3-Second Gaze Cursor -->
    <a-entity id="rig" position="0 1.6 0">
      <a-camera id="camera" look-controls wasd-controls="enabled: false">
        <a-cursor fuse="true" fuse-timeout="3000"
                  raycaster="objects: .clickable"
                  position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015"
                  material="color: #38bdf8; shader: flat">
          <a-animation begin="fuse" easing="ease-in" attribute="scale" dur="3000" fill="backwards" from="1 1 1" to="0.2 0.2 0.2"></a-animation>
        </a-cursor>
      </a-camera>

      <!-- VR Controllers Support -->
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable; lineColor: #38bdf8"></a-entity>
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable; lineColor: #38bdf8"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    document.querySelectorAll('.clickable').forEach(el => {
      el.addEventListener('click', (e) => {
        const href = e.currentTarget.getAttribute('onclick');
        if (href) {
          const match = href.match(/'([^']+)'/);
          if (match && match[1]) window.location.href = match[1];
        }
      });
    });
  </script>
</body>
</html>
