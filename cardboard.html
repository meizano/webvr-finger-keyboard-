<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardboard & PC Mixed Reality 12-Button Finger Keyboard</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- MediaPipe Tasks Vision Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/vision_bundle.js" crossorigin="anonymous"></script>
  <!-- External Configuration File -->
  <script src="./js/config.js"></script>
  <style>
    body {
      margin: 0;
      background: #090d16;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    /* Top Bar Control Panel Overlay */
    #ui-overlay {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(15, 23, 42, 0.88);
      padding: 10px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 7px 13px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #0369a1; }
    #status {
      font-size: 0.85rem;
      color: #38bdf8;
    }
    /* Bottom Display Panel Overlay */
    #typed-display {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      padding: 10px 24px;
      border-radius: 10px;
      border: 1px solid #38bdf8;
      font-size: 1.15rem;
      letter-spacing: 1px;
      min-width: 320px;
      text-align: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.25);
    }
    /* Fullscreen AR.js Style Live Camera Background */
    #passthrough-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Live Camera Stream for Passthrough MR (Android & PC compatible) -->
  <video id="passthrough-video" autoplay playsinline muted></video>

  <!-- 2D Top Navigation & Controls Overlay -->
  <div id="ui-overlay">
    <button onclick="togglePassthrough()">MR Passthrough: <span id="passthrough-label">ON</span></button>
    <button onclick="toggleCamera()">Camera: <span id="cam-label">Rear</span></button>
    <button onclick="clearText()">Clear</button>
    <button onclick="window.location.href='index.html'">Menu</button>
    <span id="status">Initializing Android & PC Camera Tracking...</span>
  </div>

  <!-- 2D Bottom Text Output Overlay -->
  <div id="typed-display">Output: <span id="text-output" style="color: #38bdf8; font-weight: bold;"></span></div>

  <!-- 3D WebVR Scene -->
  <a-scene background="transparent: true" renderer="alpha: true">
    <!-- Assets Definition -->
    <a-assets>
      <mixin id="key-btn" geometry="primitive: box; width: 0.12; height: 0.12; depth: 0.03" material="shader: flat; color: #1e293b"></mixin>
      <mixin id="seg-btn" geometry="primitive: sphere; radius: 0.022" material="shader: flat; color: #38bdf8; opacity: 0.9"></mixin>
    </a-assets>

    <!-- Lighting -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 0.9"></a-entity>
    <a-entity light="type: directional; color: #38bdf8; intensity: 0.6" position="1 3 2"></a-entity>

    <!-- ================================================================= -->
    <!-- 1. FLOATING SCREEN DISPLAY (EYE-LEVEL POSITIONED AT Y=2.1, Z=-1.6) -->
    <!-- ================================================================= -->
    <a-entity id="floating-screen" position="0 2.1 -1.6">
      <!-- Screen Backplate plane placed slightly behind at Z=-0.05 to eliminate Z-fighting flicker -->
      <a-plane width="1.8" height="0.5" color="#0f172a" opacity="0.88" material="shader: flat" position="0 0 -0.05"></a-plane>
      <a-box width="1.82" height="0.52" depth="0.01" color="#38bdf8" opacity="0.3" position="0 0 -0.06"></a-box>
      
      <!-- Output Text Display -->
      <a-text id="vr-text-output" value="Output: " align="center" color="#38bdf8" width="3.4" position="0 0.12 0.02" font="dejavu"></a-text>

      <!-- Action Buttons Pushed Forward to Z=0.08 to completely avoid intersecting plane Z-fighting -->
      <a-entity position="-0.45 -0.12 0.08" class="interactive-key" data-char="SPACE" onclick="typeChar(' ')">
        <a-box width="0.28" height="0.1" depth="0.04" color="#0ea5e9"></a-box>
        <a-text value="SPACE" align="center" color="white" width="1.2" position="0 0 0.03"></a-text>
      </a-entity>
      <a-entity position="0 -0.12 0.08" class="interactive-key" data-char="BACKSPACE" onclick="handleBackspace()">
        <a-box width="0.28" height="0.1" depth="0.04" color="#f59e0b"></a-box>
        <a-text value="BACK" align="center" color="white" width="1.2" position="0 0 0.03"></a-text>
      </a-entity>
      <a-entity position="0.45 -0.12 0.08" class="interactive-key" data-char="CLEAR" onclick="clearText()">
        <a-box width="0.28" height="0.1" depth="0.04" color="#ef4444"></a-box>
        <a-text value="CLEAR" align="center" color="white" width="1.2" position="0 0 0.03"></a-text>
      </a-entity>
    </a-entity>

    <!-- ================================================================= -->
    <!-- 2. SYNCHRONIZED 3D QWERTY KEYBOARD (POSITIONED BELOW SCREEN)     -->
    <!-- ================================================================= -->
    <a-entity id="qwerty-keyboard" position="0 1.45 -1.45" rotation="-15 0 0">
      <a-entity id="qwerty-keys-container"></a-entity>
    </a-entity>

    <!-- ================================================================= -->
    <!-- 3. FLOATING VIRTUAL RIGHT HAND RIG (SIDEWAYS ORIENTATION)          -->
    <!-- Thumb on Top, Palm facing user, Pinky on Bottom                     -->
    <!-- ================================================================= -->
    <a-entity id="virtual-hand-rig" position="-0.05 1.25 -0.8" rotation="10 -25 50">
      <!-- Visual Hand Palm Reference Line -->
      <a-entity id="hand-mesh-reference">
        <!-- Palm Backplate -->
        <a-box position="0.02 0.02 -0.01" width="0.18" height="0.18" depth="0.015" color="#1e293b" opacity="0.65"></a-box>
        <!-- Wrist Cylinder -->
        <a-cylinder position="-0.08 -0.08 -0.01" rotation="0 0 -45" radius="0.012" height="0.14" color="#334155" opacity="0.65"></a-cylinder>
        <a-text value="RIGHT HAND (A-L)" align="center" color="#94a3b8" width="1.1" position="0.02 -0.11 0.02" rotation="0 0 -50"></a-text>
      </a-entity>

      <!-- 12 FINGER SEGMENT BUTTONS (A-L) MAPPED ACROSS 4 FINGERS -->
      <!-- TOP ROW: Index Finger -> A (Tip), B (Mid), C (Base) -->
      <a-entity id="seg-A" position="0.08 0.12 0.02" class="interactive-key seg-key" data-char="A">
        <a-sphere radius="0.022" color="#ef4444"></a-sphere>
        <a-text value="A\nTip" align="center" color="white" width="0.75" position="0 0 0.025" rotation="0 0 -50"></a-text>
      </a-entity>
      <a-entity id="seg-B" position="0.02 0.11 0.02" class="interactive-key seg-key" data-char="B">
        <a-sphere radius="0.022" color="#f97316"></a-sphere>
        <a-text value="B\nMid" align="center" color="white" width="0.75" position="0 0 0.025" rotation="0 0 -50"></a-text>
      </a-entity>
      <a-entity id="seg-C" position="-0.04 0.1 0.02" class="interactive-key seg-key" data-char="C">
        <a-sphere radius="0.022" color="#facc15"></a-sphere>
        <a-text value="C\nBase" align="center" color="white" width="0.75" position="0 0 0.025" rotation="0 0 -50"></a-text>
      </a-entity>

      <!-- SECOND ROW: Middle Finger -> D (Tip), E (Mid), F (Base) -->
      <a-entity id="seg-D" position="0.09 0.06 0.02" class="interactive-key seg-key" data-char="D">
        <a-sphere radius="0.022" color="#22c55e"></a-sphere>
        <a-text value="D\nTip" align="center" color="white" width="0.75" position="0 0 0.025" rotation="0 0 -50"></a-text>
      </a-entity>
      <a-entity id="seg-E" position="0.03 0.05 0.02" class="interactive-key seg-key" data-char="E">
        <a-sphere radius="0.022" color="#10b981"></a-sphere>
        <a-text value="E\nMid" align="center" color="white" width="0.75" position="0 0 0.025" rotation="0 0 -50"></a-text>
      </a-entity>
      <a-entity id="seg-F" position="-0.03 0.04 0.02" class="interactive-key seg-key" data-char="F">
        <a-sphere radius="0.022" color="#14b8a6"></a-sphere>
        <a-text value="F\nBase" align="center" color="white" width="0.75" position="0 0 0.025" rotation="0 0 -50"></a-text>
      </a-entity>

      <!-- THIRD ROW: Ring Finger -> G (Tip), H (Mid), I (Base) -->
      <a-entity id="seg-G" position="0.08 0.0 0.02" class="interactive-key seg-key" data-char="G">
        <a-sphere radius="0.022" color="#06b6d4"></a-sphere>
        <a-text value="G\nTip" align="center" color="white" width="0.75" position="0 0 0.025" rotation="0 0 -50"></a-text>
      </a-entity>
      <a-entity id="seg-H" position="0.02 -0.01 0.02" class="interactive-key seg-key" data-char="H">
        <a-sphere radius="0.022" color="#3b82f6"></a-sphere>
        <a-text value="H\nMid" align="center" color="white" width="0.75" position="0 0 0.025" rotation="0 0 -50"></a-text>
      </a-entity>
      <a-entity id="seg-I" position="-0.04 -0.02 0.02" class="interactive-key seg-key" data-char="I">
        <a-sphere radius="0.022" color="#6366f1"></a-sphere>
        <a-text value="I\nBase" align="center" color="white" width="0.75" position="0 0 0.025" rotation="0 0 -50"></a-text>
      </a-entity>

      <!-- BOTTOM ROW: Little Finger -> J (Tip), K (Mid), L (Base) -->
      <a-entity id="seg-J" position="0.06 -0.06 0.02" class="interactive-key seg-key" data-char="J">
        <a-sphere radius="0.022" color="#8b5cf6"></a-sphere>
        <a-text value="J\nTip" align="center" color="white" width="0.75" position="0 0 0.025" rotation="0 0 -50"></a-text>
      </a-entity>
      <a-entity id="seg-K" position="0.0 -0.07 0.02" class="interactive-key seg-key" data-char="K">
        <a-sphere radius="0.022" color="#a855f7"></a-sphere>
        <a-text value="K\nMid" align="center" color="white" width="0.75" position="0 0 0.025" rotation="0 0 -50"></a-text>
      </a-entity>
      <a-entity id="seg-L" position="-0.06 -0.08 0.02" class="interactive-key seg-key" data-char="L">
        <a-sphere radius="0.022" color="#ec4899"></a-sphere>
        <a-text value="L\nBase" align="center" color="white" width="0.75" position="0 0 0.025" rotation="0 0 -50"></a-text>
      </a-entity>

      <!-- Thumb Tip Actuator (Positioned at top for sideways palm orientation) -->
      <a-entity id="thumb-actuator" position="-0.08 0.16 0.03">
        <a-sphere radius="0.02" color="#f43f5e"></a-sphere>
        <a-text value="Thumb" align="center" color="#f43f5e" width="0.7" position="0 -0.03 0" rotation="0 0 -50"></a-text>
      </a-entity>
    </a-entity>

    <!-- ================================================================= -->
    <!-- 4. CAMERA RIG WITH GAZE RETICLE TIMER (3 SECONDS DWELL TIMER)      -->
    <!-- ================================================================= -->
    <a-entity id="rig" position="0 1.6 0">
      <a-camera id="camera" look-controls="enabled: true">
        <!-- 3-Second Gaze Fuse Reticle Ring (A-Frame 1.x working animation components) -->
        <a-entity position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.008; radiusOuter: 0.015"
                  material="color: #38bdf8; shader: flat"
                  cursor="maxDistance: 30; fuse: true; fuseTimeout: 3000"
                  raycaster="objects: .interactive-key, .clickable"
                  animation__click="property: scale; from: 0.2 0.2 0.2; to: 1 1 1; startEvents: click; dur: 150; easing: easeInQuad"
                  animation__fusing="property: scale; from: 1 1 1; to: 0.15 0.15 0.15; startEvents: fusing; dur: 3000; easing: easeInQuad">
        </a-entity>
      </a-camera>
    </a-entity>
  </a-scene>

  <!-- ================================================================= -->
  <!-- APPLICATION JAVASCRIPT LOGIC & MODULAR FUNCTIONS                 -->
  <!-- ================================================================= -->
  <script>
    // Configuration Fallback (Uses APP_CONFIG from js/config.js if available)
    const C = window.APP_CONFIG || {
      screen: { position: { x: 0, y: 2.1, z: -1.6 } },
      gaze: { timeoutMs: 3000 },
      tracking: { touchThreshold: 0.045, touchCooldownMs: 600 },
      audio: { frequencyHz: 587.33, durationSec: 0.12, volume: 0.15 }
    };

    let typedText = '';
    let useRearCamera = true;
    let passthroughActive = true;
    let handLandmarker = undefined;
    let isTrackingHand = false;
    let audioCtx = null;
    let lastTouchTime = {};

    // 12 Finger Segment Keys Definition (Right Hand MediaPipe Landmarks)
    const segmentKeysMap = [
      { id: 'seg-A', char: 'A', landmark: 8 },  // Index Tip
      { id: 'seg-B', char: 'B', landmark: 7 },  // Index Mid
      { id: 'seg-C', char: 'C', landmark: 6 },  // Index Base
      { id: 'seg-D', char: 'D', landmark: 12 }, // Mid Tip
      { id: 'seg-E', char: 'E', landmark: 11 }, // Mid Mid
      { id: 'seg-F', char: 'F', landmark: 10 }, // Mid Base
      { id: 'seg-G', char: 'G', landmark: 16 }, // Ring Tip
      { id: 'seg-H', char: 'H', landmark: 15 }, // Ring Mid
      { id: 'seg-I', char: 'I', landmark: 14 }, // Ring Base
      { id: 'seg-J', char: 'J', landmark: 20 }, // Little Tip
      { id: 'seg-K', char: 'K', landmark: 19 }, // Little Mid
      { id: 'seg-L', char: 'L', landmark: 18 }  // Little Base
    ];

    // QWERTY Layout Rows
    const qwertyRows = [
      ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
      ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
      ['Z', 'X', 'C', 'V', 'B', 'N', 'M']
    ];

    /**
     * Web Audio API Synthesizer Feedback
     * Generates a soft D5 audio beep tone on keypress
     */
    function playBeepSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(C.audio.frequencyHz, audioCtx.currentTime);
        gain.gain.setValueAtTime(C.audio.volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + C.audio.durationSec);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + C.audio.durationSec);
      } catch (e) {
        console.warn("Audio Context error:", e);
      }
    }

    /**
     * Builds the 3D QWERTY Keyboard dynamically under the floating screen
     */
    function buildQwertyKeyboard() {
      const container = document.getElementById('qwerty-keys-container');
      if (!container) return;
      container.innerHTML = '';

      qwertyRows.forEach((row, rowIndex) => {
        const yPos = -rowIndex * 0.15;
        const rowWidth = row.length * 0.14;
        const startX = -rowWidth / 2 + 0.07;

        row.forEach((char, colIndex) => {
          const xPos = startX + colIndex * 0.14;
          const keyEl = document.createElement('a-entity');
          keyEl.setAttribute('id', `qwerty-key-${char}`);
          keyEl.setAttribute('class', 'interactive-key qwerty-key');
          keyEl.setAttribute('position', `${xPos} ${yPos} 0`);
          keyEl.setAttribute('data-char', char);

          // Key Box Mesh
          const box = document.createElement('a-box');
          box.setAttribute('width', '0.12');
          box.setAttribute('height', '0.12');
          box.setAttribute('depth', '0.03');
          box.setAttribute('color', '#1e293b');
          keyEl.appendChild(box);

          // Key Character Label
          const text = document.createElement('a-text');
          text.setAttribute('value', char);
          text.setAttribute('align', 'center');
          text.setAttribute('color', '#f8fafc');
          text.setAttribute('width', '1.8');
          text.setAttribute('position', '0 0 0.02');
          keyEl.appendChild(text);

          keyEl.addEventListener('click', () => typeChar(char));
          container.appendChild(keyEl);
        });
      });
    }

    /**
     * Highlights the QWERTY key on the floating screen when a letter is typed
     */
    function highlightQwertyKey(char) {
      const keyEl = document.getElementById(`qwerty-key-${char}`);
      if (keyEl) {
        const box = keyEl.querySelector('a-box');
        if (box) {
          const originalColor = box.getAttribute('color');
          box.setAttribute('color', '#38bdf8'); // Glowing Cyan
          box.setAttribute('scale', '1.1 1.1 1.1');
          setTimeout(() => {
            box.setAttribute('color', originalColor);
            box.setAttribute('scale', '1 1 1');
          }, 300);
        }
      }
    }

    /**
     * Handles Character Input
     */
    function typeChar(char) {
      typedText += char;
      updateDisplay();
      playBeepSound();
      if (char !== ' ') {
        highlightQwertyKey(char.toUpperCase());
      }
    }

    function handleBackspace() {
      if (typedText.length > 0) {
        typedText = typedText.slice(0, -1);
        updateDisplay();
        playBeepSound();
      }
    }

    function clearText() {
      typedText = '';
      updateDisplay();
    }

    function updateDisplay() {
      document.getElementById('text-output').innerText = typedText;
      const vrText = document.getElementById('vr-text-output');
      if (vrText) vrText.setAttribute('value', 'Output: ' + typedText);
    }

    /**
     * Initializes Camera Stream with Fallbacks for Android Compatibility
     */
    async function initCamera() {
      const video = document.getElementById('passthrough-video');
      if (window.stream) {
        window.stream.getTracks().forEach(track => track.stop());
      }

      // Android-friendly constraints ladder
      const constraintsList = [
        { video: { facingMode: useRearCamera ? { exact: "environment" } : "user", width: { ideal: 1280 }, height: { ideal: 720 } } },
        { video: { facingMode: useRearCamera ? "environment" : "user", width: { ideal: 640 }, height: { ideal: 480 } } },
        { video: true }
      ];

      for (let constraints of constraintsList) {
        try {
          window.stream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = window.stream;
          video.setAttribute('playsinline', '');
          video.setAttribute('muted', '');
          await video.play(); // Explicit play call for Android
          video.addEventListener('loadeddata', predictWebcam);
          console.log("Camera started successfully with constraints:", constraints);
          break;
        } catch (err) {
          console.warn("Camera constraint attempt failed:", err);
        }
      }
    }

    function togglePassthrough() {
      passthroughActive = !passthroughActive;
      const video = document.getElementById('passthrough-video');
      video.style.display = passthroughActive ? 'block' : 'none';
      document.getElementById('passthrough-label').innerText = passthroughActive ? 'ON' : 'OFF';
      document.getElementById('status').innerText = passthroughActive ? "MR Passthrough Active (Webcam)" : "Virtual VR Room Active";
    }

    function toggleCamera() {
      useRearCamera = !useRearCamera;
      document.getElementById('cam-label').innerText = useRearCamera ? 'Rear' : 'Front';
      initCamera();
    }

    /**
     * Initializes MediaPipe Tasks Vision HandLandmarker with GPU & CPU Fallbacks for Android
     */
    async function initMediaPipe() {
      try {
        const { HandLandmarker, FilesetResolver } = window.vision;
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
        );

        // Try GPU delegate first, fallback to CPU delegate for Android WebGL compatibility
        const delegates = ["GPU", "CPU"];
        for (let delegate of delegates) {
          try {
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
              baseOptions: {
                modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                delegate: delegate
              },
              runningMode: "VIDEO",
              numHands: 1
            });
            console.log(`MediaPipe initialized successfully using ${delegate} delegate.`);
            document.getElementById('status').innerText = `Hand Tracking Ready (${delegate}). Show Right Hand or Gaze 3s!`;
            break;
          } catch (e) {
            console.warn(`MediaPipe ${delegate} delegate failed, trying fallback:`, e);
          }
        }
      } catch (e) {
        console.warn("MediaPipe FilesetResolver error:", e);
        document.getElementById('status').innerText = "Gaze 3s Ready! (Show Right Hand or gaze at keys)";
      }
    }

    /**
     * Real-time MediaPipe Hand Detection Loop
     */
    let lastVideoTime = -1;
    async function predictWebcam() {
      const video = document.getElementById('passthrough-video');
      // Ensure video is playing and ready before predicting (Fix for Android)
      if (!handLandmarker || video.paused || video.ended || video.readyState < 2) {
        requestAnimationFrame(predictWebcam);
        return;
      }

      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const startTimeMs = performance.now();
        const results = handLandmarker.detectForVideo(video, startTimeMs);

        if (results.landmarks && results.landmarks.length > 0) {
          isTrackingHand = true;
          const landmarks = results.landmarks[0];
          const thumbTip = landmarks[4];
          const wrist = landmarks[0];

          // Dynamically map Hand Rig to tracked hand 3D coordinates
          const rigEl = document.getElementById('virtual-hand-rig');
          if (rigEl) {
            const rx = (wrist.x - 0.5) * -1.2;
            const ry = (1.0 - wrist.y - 0.5) * 1.2 + 1.25;
            const rz = (wrist.z - 0.2) * -1.2 - 0.8;
            rigEl.setAttribute('position', `${rx} ${ry} ${rz}`);
          }

          // Check Thumb Touch Proximity for 12 Finger Segment Keys
          const now = performance.now();
          segmentKeysMap.forEach(key => {
            const joint = landmarks[key.landmark];
            if (joint) {
              const segEl = document.getElementById(key.id);
              if (segEl) {
                const sx = (joint.x - wrist.x) * -1.2;
                const sy = (wrist.y - joint.y) * 1.2;
                segEl.setAttribute('position', `${sx} ${sy} 0.02`);
              }

              // Calculate 3D Euclidean distance
              const dx = thumbTip.x - joint.x;
              const dy = thumbTip.y - joint.y;
              const dz = thumbTip.z - joint.z;
              const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);

              if (dist < C.tracking.touchThreshold) { // 4.5 cm threshold
                if (!lastTouchTime[key.char] || (now - lastTouchTime[key.char] > C.tracking.touchCooldownMs)) {
                  lastTouchTime[key.char] = now;
                  typeChar(key.char);
                }
              }
            }
          });
        } else {
          // Revert Hand Rig back to default sideways floating position in front of face
          if (isTrackingHand) {
            isTrackingHand = false;
            const rigEl = document.getElementById('virtual-hand-rig');
            if (rigEl) {
              rigEl.setAttribute('position', '-0.05 1.25 -0.8');
            }
          }
        }
      }
      requestAnimationFrame(predictWebcam);
    }

    // Physical Keyboard Fallback for PC testing
    window.addEventListener('keydown', (e) => {
      const key = e.key.toUpperCase();
      if (key >= 'A' && key <= 'Z' && key.length === 1) {
        typeChar(key);
      } else if (e.key === ' ') {
        typeChar(' ');
      } else if (e.key === 'Backspace') {
        handleBackspace();
      }
    });

    // Page Load Setup
    window.addEventListener('DOMContentLoaded', () => {
      buildQwertyKeyboard();
      initCamera();
      setTimeout(initMediaPipe, 800);

      // Attach click handlers to 12 segment keys
      segmentKeysMap.forEach(key => {
        const segEl = document.getElementById(key.id);
        if (segEl) {
          segEl.addEventListener('click', () => typeChar(key.char));
        }
      });
    });
  </script>
</body>
</html>
