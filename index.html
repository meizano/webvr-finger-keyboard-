<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebVR 12-Button Finger Segment Typing - Landing Page</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .ui-overlay {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      background: rgba(15, 23, 42, 0.85);
      padding: 16px 24px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
      backdrop-filter: blur(8px);
      max-width: 600px;
      width: 90%;
    }
    h1 { margin: 0 0 8px 0; font-size: 1.5rem; color: #38bdf8; }
    p { margin: 0 0 12px 0; font-size: 0.95rem; color: #94a3b8; }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }
    .btn:hover {
      background: linear-gradient(135deg, #0369a1, #075985);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="ui-overlay">
    <h1>12-Button Finger Segment Typing VR</h1>
    <p>Type using 12 buttons mapped across your right-hand segments (Tip, Middle, Base of Index, Middle, Ring, Little fingers).</p>
    <div class="btn-group">
      <a href="cardboard.html" class="btn">Google Cardboard (Camera Tracking)</a>
      <a href="webxr.html" class="btn">Native WebXR (VR Headset)</a>
    </div>
  </div>

  <a-scene background="color: #090d16">
    <!-- Assets -->
    <a-assets>
      <mixin id="card-panel" geometry="primitive: plane; width: 2.2; height: 1.4" material="shader: flat; color: #1e293b; transparent: true; opacity: 0.9"></mixin>
      <mixin id="text-style" text="align: center; width: 4; font: dejavu"></mixin>
    </a-assets>

    <!-- Environment Lighting -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; color: #38bdf8; intensity: 0.6" position="-1 4 2"></a-entity>

    <!-- Ground Grid / Floor -->
    <a-grid position="0 0 0" rotation="0 0 0" material="color: #1e293b; opacity: 0.5"></a-grid>

    <!-- Center Title in 3D -->
    <a-entity position="0 2.8 -3">
      <a-text value="12-BUTTON FINGER TYPING VR" align="center" color="#38bdf8" width="6" font="dejavu"></a-text>
      <a-text value="Select VR Mode Below" align="center" color="#94a3b8" width="4" position="0 -0.4 0" font="dejavu"></a-text>
    </a-entity>

    <!-- Mode 1: Google Cardboard Portal Card -->
    <a-entity position="-1.5 1.5 -2.5" rotation="0 20 0">
      <a-entity mixin="card-panel" class="clickable" onclick="window.location.href='cardboard.html'"></a-entity>
      <a-box position="0 0 -0.02" width="2.25" height="1.45" depth="0.02" color="#0ea5e9" opacity="0.3"></a-box>
      <a-text value="Google Cardboard\n(Camera Hand Tracking)" align="center" color="#ffffff" width="3.5" position="0 0.3 0.05" font="dejavu"></a-text>
      <a-text value="Uses phone rear camera &\nMediaPipe. Best for Cardboard." align="center" color="#cbd5e1" width="3" position="0 -0.2 0.05" font="dejavu" scale="0.8 0.8 0.8"></a-text>
      <!-- Clickable target plane -->
      <a-plane width="2.2" height="1.4" position="0 0 0.03" material="opacity: 0" class="clickable" onclick="window.location.href='cardboard.html'"></a-plane>
    </a-entity>

    <!-- Mode 2: Native WebXR Portal Card -->
    <a-entity position="1.5 1.5 -2.5" rotation="0 -20 0">
      <a-entity mixin="card-panel" class="clickable" onclick="window.location.href='webxr.html'"></a-entity>
      <a-box position="0 0 -0.02" width="2.25" height="1.45" depth="0.02" color="#6366f1" opacity="0.3"></a-box>
      <a-text value="Native WebXR Mode\n(Headset Hand Tracking)" align="center" color="#ffffff" width="3.5" position="0 0.3 0.05" font="dejavu"></a-text>
      <a-text value="Uses WebXR Hand API.\nBest for Quest / Vision Pro." align="center" color="#cbd5e1" width="3" position="0 -0.2 0.05" font="dejavu" scale="0.8 0.8 0.8"></a-text>
      <!-- Clickable target plane -->
      <a-plane width="2.2" height="1.4" position="0 0 0.03" material="opacity: 0" class="clickable" onclick="window.location.href='webxr.html'"></a-plane>
    </a-entity>

    <!-- Camera Rig with Gaze, Mouse, and Controllers -->
    <a-entity id="rig" position="0 1.6 0">
      <a-camera id="camera" look-controls wasd-controls="enabled: false">
        <!-- Gaze / Fuse Cursor for Cardboard -->
        <a-cursor fuse="true" fuse-timeout="1500"
                  raycaster="objects: .clickable"
                  position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015"
                  material="color: #38bdf8; shader: flat">
          <a-animation begin="fuse" easing="ease-in" attribute="scale" dur="1500" fill="backwards" from="1 1 1" to="0.2 0.2 0.2"></a-animation>
        </a-cursor>
      </a-camera>

      <!-- VR Controllers Support -->
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable; lineColor: #38bdf8"></a-entity>
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable; lineColor: #38bdf8"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    // Handle click / gaze trigger for links in A-Frame
    document.querySelectorAll('.clickable').forEach(el => {
      el.addEventListener('click', (e) => {
        const href = e.currentTarget.getAttribute('onclick');
        if (href) {
          const match = href.match(/'([^']+)'/);
          if (match && match[1]) {
            window.location.href = match[1];
          }
        }
      });
    });
  </script>
</body>
</html>
