<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Cardboard Hand-Tracking 12-Button Keyboard</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- MediaPipe Tasks Vision -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/vision_bundle.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    #ui-overlay {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(15, 23, 42, 0.9);
      padding: 10px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #0369a1; }
    #status {
      font-size: 0.9rem;
      color: #38bdf8;
      margin-left: 10px;
    }
    #typed-display {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(30, 41, 59, 0.95);
      padding: 12px 24px;
      border-radius: 10px;
      border: 1px solid #38bdf8;
      font-size: 1.2rem;
      letter-spacing: 1px;
      min-width: 300px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2);
    }
    #webcam {
      position: fixed;
      bottom: 10px;
      right: 10px;
      width: 160px;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid #38bdf8;
      z-index: 999;
      transform: scaleX(-1);
    }
  </style>
</head>
<body>
  <div id="ui-overlay">
    <button onclick="toggleCamera()">Toggle Camera (Rear/Front)</button>
    <button onclick="toggleMode()">Mode: <span id="mode-label">Direct A-L</span></button>
    <button onclick="clearText()">Clear</button>
    <button onclick="window.location.href='index.html'">Back to Menu</button>
    <span id="status">Initializing Hand Tracking...</span>
  </div>

  <div id="typed-display">Output: <span id="text-output" style="color: #38bdf8; font-weight: bold;"></span></div>

  <video id="webcam" autoplay playsinline></video>

  <a-scene background="color: #050b14">
    <a-assets>
      <mixin id="key-sphere" geometry="primitive: sphere; radius: 0.025" material="shader: flat; color: #38bdf8; opacity: 0.8"></mixin>
    </a-assets>

    <!-- Environment -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 0.9"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 0.5" position="1 3 2"></a-entity>

    <!-- Floating Output & Guide in VR -->
    <a-entity position="0 1.6 -1.8">
      <a-plane width="1.6" height="0.6" color="#1e293b" opacity="0.85" position="0 0.3 0"></a-plane>
      <a-text id="vr-text" value="Output: " align="center" color="#38bdf8" width="3.2" position="0 0.3 0.02" font="dejavu"></a-text>

      <a-text value="Index: A(Tip) B(Mid) C(Base) | Mid: D(Tip) E(Mid) F(Base)" align="center" color="#94a3b8" width="2.5" position="0 -0.1 0.02" font="dejavu" scale="0.7 0.7 0.7"></a-text>
      <a-text value="Ring: G(Tip) H(Mid) I(Base) | Little: J(Tip) K(Mid) L(Base)" align="center" color="#94a3b8" width="2.5" position="0 -0.2 0.02" font="dejavu" scale="0.7 0.7 0.7"></a-text>
    </a-entity>

    <!-- 12 Virtual Button 3D Meshes (Attached near hand or floating for reference) -->
    <a-entity id="button-entities">
      <!-- Index Fingers -->
      <a-entity id="btn-A" position="-0.1 1.2 -1"><a-sphere radius="0.02" color="#ef4444"></a-sphere><a-text value="A" align="center" position="0 0.03 0" color="white" width="1"></a-text></a-entity>
      <a-entity id="btn-B" position="-0.08 1.15 -1"><a-sphere radius="0.02" color="#f97316"></a-sphere><a-text value="B" align="center" position="0 0.03 0" color="white" width="1"></a-text></a-entity>
      <a-entity id="btn-C" position="-0.06 1.1 -1"><a-sphere radius="0.02" color="#facc15"></a-sphere><a-text value="C" align="center" position="0 0.03 0" color="white" width="1"></a-text></a-entity>
      <!-- Middle Fingers -->
      <a-entity id="btn-D" position="-0.03 1.2 -1"><a-sphere radius="0.02" color="#22c55e"></a-sphere><a-text value="D" align="center" position="0 0.03 0" color="white" width="1"></a-text></a-entity>
      <a-entity id="btn-E" position="-0.02 1.15 -1"><a-sphere radius="0.02" color="#10b981"></a-sphere><a-text value="E" align="center" position="0 0.03 0" color="white" width="1"></a-text></a-entity>
      <a-entity id="btn-F" position="-0.01 1.1 -1"><a-sphere radius="0.02" color="#14b8a6"></a-sphere><a-text value="F" align="center" position="0 0.03 0" color="white" width="1"></a-text></a-entity>
      <!-- Ring Fingers -->
      <a-entity id="btn-G" position="0.02 1.2 -1"><a-sphere radius="0.02" color="#06b6d4"></a-sphere><a-text value="G" align="center" position="0 0.03 0" color="white" width="1"></a-text></a-entity>
      <a-entity id="btn-H" position="0.03 1.15 -1"><a-sphere radius="0.02" color="#3b82f6"></a-sphere><a-text value="H" align="center" position="0 0.03 0" color="white" width="1"></a-text></a-entity>
      <a-entity id="btn-I" position="0.04 1.1 -1"><a-sphere radius="0.02" color="#6366f1"></a-sphere><a-text value="I" align="center" position="0 0.03 0" color="white" width="1"></a-text></a-entity>
      <!-- Little Fingers -->
      <a-entity id="btn-J" position="0.07 1.2 -1"><a-sphere radius="0.02" color="#8b5cf6"></a-sphere><a-text value="J" align="center" position="0 0.03 0" color="white" width="1"></a-text></a-entity>
      <a-entity id="btn-K" position="0.08 1.15 -1"><a-sphere radius="0.02" color="#a855f7"></a-sphere><a-text value="K" align="center" position="0 0.03 0" color="white" width="1"></a-text></a-entity>
      <a-entity id="btn-L" position="0.09 1.1 -1"><a-sphere radius="0.02" color="#ec4899"></a-sphere><a-text value="L" align="center" position="0 0.03 0" color="white" width="1"></a-text></a-entity>
    </a-entity>

    <!-- Cardboard Camera Rig -->
    <a-entity id="rig" position="0 1.6 0">
      <a-camera id="camera" look-controls="enabled: true"></a-camera>
    </a-entity>
  </a-scene>

  <script>
    let handLandmarker = undefined;
    let webcamRunning = false;
    let useRearCamera = true;
    let currentMode = 'direct'; // 'direct' (A-L) or 'multitap' (A-Z)
    let typedText = '';
    let lastTouchTime = {};
    const TOUCH_COOLDOWN = 600; // ms debounce

    const keysMap = [
      { id: 'btn-A', name: 'A', landmarkIndex: 8, finger: 'Index Tip' },
      { id: 'btn-B', name: 'B', landmarkIndex: 7, finger: 'Index Mid' },
      { id: 'btn-C', name: 'C', landmarkIndex: 6, finger: 'Index Base' },
      { id: 'btn-D', name: 'D', landmarkIndex: 12, finger: 'Mid Tip' },
      { id: 'btn-E', name: 'E', landmarkIndex: 11, finger: 'Mid Mid' },
      { id: 'btn-F', name: 'F', landmarkIndex: 10, finger: 'Mid Base' },
      { id: 'btn-G', name: 'G', landmarkIndex: 16, finger: 'Ring Tip' },
      { id: 'btn-H', name: 'H', landmarkIndex: 15, finger: 'Ring Mid' },
      { id: 'btn-I', name: 'I', landmarkIndex: 14, finger: 'Ring Base' },
      { id: 'btn-J', name: 'J', landmarkIndex: 20, finger: 'Little Tip' },
      { id: 'btn-K', name: 'K', landmarkIndex: 19, finger: 'Little Mid' },
      { id: 'btn-L', name: 'L', landmarkIndex: 18, finger: 'Little Base' }
    ];

    const multitapMap = {
      'A': 'A', 'B': 'B', 'C': 'C', 'D': 'D', 'E': 'E', 'F': 'F',
      'G': 'G', 'H': 'H', 'I': 'I', 'J': 'J', 'K': 'K', 'L': 'L'
    };

    async function initMediaPipe() {
      const { HandLandmarker, FilesetResolver } = window.vision;
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
      );
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 1
      });
      document.getElementById('status').innerText = "Hand Tracking Ready. Show Right Hand!";
      startCamera();
    }

    async function startCamera() {
      const video = document.getElementById('webcam');
      if (window.stream) {
        window.stream.getTracks().forEach(track => track.stop());
      }
      const constraints = {
        video: {
          facingMode: useRearCamera ? { exact: "environment" } : "user",
          width: { ideal: 640 },
          height: { ideal: 480 }
        }
      };
      try {
        window.stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = window.stream;
        video.addEventListener('loadeddata', predictWebcam);
      } catch (err) {
        console.warn("Exact environment camera failed, falling back to any camera:", err);
        try {
          window.stream = await navigator.mediaDevices.getUserMedia({ video: true });
          video.srcObject = window.stream;
          video.addEventListener('loadeddata', predictWebcam);
        } catch (e) {
          document.getElementById('status').innerText = "Camera Error: " + e.message;
        }
      }
    }

    function toggleCamera() {
      useRearCamera = !useRearCamera;
      document.getElementById('status').innerText = useRearCamera ? "Switching to Rear Camera..." : "Switching to Front Camera...";
      startCamera();
    }

    function toggleMode() {
      if (currentMode === 'direct') {
        currentMode = 'multitap';
        document.getElementById('mode-label').innerText = 'Multi-Tap A-Z';
      } else {
        currentMode = 'direct';
        document.getElementById('mode-label').innerText = 'Direct A-L';
      }
    }

    function clearText() {
      typedText = '';
      updateDisplay();
    }

    function updateDisplay() {
      document.getElementById('text-output').innerText = typedText;
      const vrText = document.getElementById('vr-text');
      if (vrText) vrText.setAttribute('value', 'Output: ' + typedText);
    }

    let lastVideoTime = -1;
    async function predictWebcam() {
      const video = document.getElementById('webcam');
      if (!handLandmarker || video.paused || video.ended) {
        requestAnimationFrame(predictWebcam);
        return;
      }

      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const startTimeMs = performance.now();
        const results = handLandmarker.detectForVideo(video, startTimeMs);

        if (results.landmarks && results.landmarks.length > 0) {
          // Assuming right hand or first detected hand
          const landmarks = results.landmarks[0];
          
          // Thumb tip is landmark 4
          const thumbTip = landmarks[4];

          // Check proximity between thumb tip and each key landmark
          const now = performance.now();
          keysMap.forEach(key => {
            const joint = landmarks[key.landmarkIndex];
            if (joint) {
              // Update 3D button position in VR relative to camera view
              const btnEl = document.getElementById(key.id);
              if (btnEl) {
                // Map normalized landmark coords (0 to 1) to VR space coordinates
                const x = (joint.x - 0.5) * -1.2;
                const y = (1.0 - joint.y - 0.5) * 1.2 + 1.2;
                const z = (joint.z - 0.2) * -1.5 - 1.0;
                btnEl.setAttribute('position', `${x} ${y} ${z}`);
              }

              // Calculate Euclidean distance between thumb tip and segment joint
              const dx = thumbTip.x - joint.x;
              const dy = thumbTip.y - joint.y;
              const dz = thumbTip.z - joint.z;
              const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);

              // Touch threshold
              if (dist < 0.05) {
                if (!lastTouchTime[key.name] || (now - lastTouchTime[key.name] > TOUCH_COOLDOWN)) {
                  lastTouchTime[key.name] = now;
                  handleKeyPress(key.name);
                }
              }
            }
          });
        }
      }
      requestAnimationFrame(predictWebcam);
    }

    function handleKeyPress(char) {
      if (currentMode === 'direct') {
        typedText += char;
      } else {
        // Multi-tap or modifier logic
        typedText += char;
      }
      updateDisplay();
      
      // Flash key color or audio feedback
      console.log("Typed:", char);
    }

    // Start MediaPipe on load
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(initMediaPipe, 1000);
    });
  </script>
</body>
</html>
