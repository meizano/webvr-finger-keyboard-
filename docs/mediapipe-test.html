<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaPipe Dual-Hand Tracking & Skeleton Test</title>
  <style>
    body {
      margin: 0;
      background: #090d16;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    #ui-bar {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(15, 23, 42, 0.9);
      padding: 10px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      gap: 12px;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
    }
    button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #0369a1; }
    #stats {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.85);
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid #38bdf8;
      font-size: 0.95rem;
      color: #38bdf8;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
  <script type="module" crossorigin src="./assets/mediapipeTest-UT21FmTt.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
</head>
<body>
  <div id="ui-bar">
    <button onclick="window.toggleCamera()">Toggle Camera (Rear/Front)</button>
    <button onclick="window.location.href='cardboard.html'">Open VR App</button>
    <button onclick="window.location.href='index.html'">Back to Menu</button>
    <span id="status" style="color: #38bdf8; font-size: 0.9rem;">Loading MediaPipe...</span>
  </div>

  <div id="stats">
    <div><strong>MediaPipe Hand Detection Stats:</strong></div>
    <div id="hand-count">Detected Hands: 0</div>
    <div id="handedness-info">Left: - | Right: -</div>
  </div>

  <div id="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <!-- ES Module Import for MediaPipe Tasks Vision -->
</body>
</html>
