<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Native WebXR Mixed Reality 12-Button Finger Keyboard</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    body {
      margin: 0;
      background: transparent;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .ui-overlay {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(15, 23, 42, 0.9);
      padding: 12px 24px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    button {
      background: #6366f1;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #4f46e5; }
    #typed-display {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      padding: 10px 24px;
      border-radius: 10px;
      border: 1px solid #6366f1;
      font-size: 1.15rem;
      letter-spacing: 1px;
      min-width: 320px;
      text-align: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.25);
    }
  </style>
</head>
<body>
  <div class="ui-overlay">
    <span>Native WebXR MR Mode</span>
    <button onclick="togglePassthrough()">Passthrough: <span id="passthru-label">ON</span></button>
    <button onclick="clearText()">Clear Text</button>
    <button onclick="window.location.href='index.html'">Back to Menu</button>
  </div>

  <div id="typed-display">Output: <span id="text-output" style="color: #818cf8; font-weight: bold;"></span></div>

  <a-scene webxr="optionalFeatures: hand-tracking, hit-test, local-floor, passthrough" renderer="alpha: true" background="transparent: true">
    <a-assets>
      <mixin id="key-btn" geometry="primitive: box; width: 0.12; height: 0.12; depth: 0.03" material="shader: flat; color: #1e293b"></mixin>
    </a-assets>

    <!-- Lighting -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 0.9"></a-entity>
    <a-entity light="type: directional; color: #818cf8; intensity: 0.6" position="1 4 2"></a-entity>

    <!-- 1. Floating Screen Display -->
    <a-entity id="floating-screen" position="0 1.8 -1.5">
      <a-plane width="1.8" height="0.5" color="#0f172a" opacity="0.88" material="shader: flat"></a-plane>
      <a-box width="1.82" height="0.52" depth="0.02" color="#818cf8" opacity="0.3" position="0 0 -0.01"></a-box>
      <a-text id="vr-text-output" value="Output: " align="center" color="#818cf8" width="3.4" position="0 0.1 0.02" font="dejavu"></a-text>

      <!-- Action Buttons under Floating Screen -->
      <a-entity position="-0.4 -0.15 0.03" class="interactive-key" data-char="SPACE" onclick="typeChar(' ')">
        <a-box width="0.3" height="0.1" depth="0.03" color="#6366f1"></a-box>
        <a-text value="SPACE" align="center" color="white" width="1.2" position="0 0 0.02"></a-text>
      </a-entity>
      <a-entity position="0 -0.15 0.03" class="interactive-key" data-char="BACKSPACE" onclick="handleBackspace()">
        <a-box width="0.3" height="0.1" depth="0.03" color="#f59e0b"></a-box>
        <a-text value="BACK" align="center" color="white" width="1.2" position="0 0 0.02"></a-text>
      </a-entity>
      <a-entity position="0.4 -0.15 0.03" class="interactive-key" data-char="CLEAR" onclick="clearText()">
        <a-box width="0.3" height="0.1" depth="0.03" color="#ef4444"></a-box>
        <a-text value="CLEAR" align="center" color="white" width="1.2" position="0 0 0.02"></a-text>
      </a-entity>
    </a-entity>

    <!-- 2. Synchronized 3D QWERTY Keyboard -->
    <a-entity id="qwerty-keyboard" position="0 1.25 -1.45" rotation="-15 0 0">
      <a-entity id="qwerty-keys-container"></a-entity>
    </a-entity>

    <!-- 3. Floating Virtual Hand & 12 Finger Segment Buttons (Default in front of face) -->
    <a-entity id="virtual-hand-rig" position="0 1.25 -0.85">
      <a-entity id="hand-mesh-reference">
        <a-cylinder position="0 -0.12 0" radius="0.01" height="0.15" color="#334155" opacity="0.6"></a-cylinder>
        <a-box position="0 -0.05 0" width="0.16" height="0.12" depth="0.02" color="#1e293b" opacity="0.6"></a-box>
        <a-text value="RIGHT HAND SEGMENTS (A-L)" align="center" color="#94a3b8" width="1.2" position="0 -0.15 0.02"></a-text>
      </a-entity>

      <!-- 12 Finger Segment Buttons (A through L) -->
      <a-entity id="seg-A" position="-0.08 0.1 0" class="interactive-key seg-key" data-char="A"><a-sphere radius="0.022" color="#ef4444"></a-sphere><a-text value="A\nTip" align="center" color="white" width="0.8" position="0 0.03 0.02"></a-text></a-entity>
      <a-entity id="seg-B" position="-0.08 0.04 0" class="interactive-key seg-key" data-char="B"><a-sphere radius="0.022" color="#f97316"></a-sphere><a-text value="B\nMid" align="center" color="white" width="0.8" position="0 0.03 0.02"></a-text></a-entity>
      <a-entity id="seg-C" position="-0.08 -0.02 0" class="interactive-key seg-key" data-char="C"><a-sphere radius="0.022" color="#facc15"></a-sphere><a-text value="C\nBase" align="center" color="white" width="0.8" position="0 0.03 0.02"></a-text></a-entity>

      <a-entity id="seg-D" position="-0.02 0.12 0" class="interactive-key seg-key" data-char="D"><a-sphere radius="0.022" color="#22c55e"></a-sphere><a-text value="D\nTip" align="center" color="white" width="0.8" position="0 0.03 0.02"></a-text></a-entity>
      <a-entity id="seg-E" position="-0.02 0.05 0" class="interactive-key seg-key" data-char="E"><a-sphere radius="0.022" color="#10b981"></a-sphere><a-text value="E\nMid" align="center" color="white" width="0.8" position="0 0.03 0.02"></a-text></a-entity>
      <a-entity id="seg-F" position="-0.02 -0.02 0" class="interactive-key seg-key" data-char="F"><a-sphere radius="0.022" color="#14b8a6"></a-sphere><a-text value="F\nBase" align="center" color="white" width="0.8" position="0 0.03 0.02"></a-text></a-entity>

      <a-entity id="seg-G" position="0.04 0.1 0" class="interactive-key seg-key" data-char="G"><a-sphere radius="0.022" color="#06b6d4"></a-sphere><a-text value="G\nTip" align="center" color="white" width="0.8" position="0 0.03 0.02"></a-text></a-entity>
      <a-entity id="seg-H" position="0.04 0.04 0" class="interactive-key seg-key" data-char="H"><a-sphere radius="0.022" color="#3b82f6"></a-sphere><a-text value="H\nMid" align="center" color="white" width="0.8" position="0 0.03 0.02"></a-text></a-entity>
      <a-entity id="seg-I" position="0.04 -0.02 0" class="interactive-key seg-key" data-char="I"><a-sphere radius="0.022" color="#6366f1"></a-sphere><a-text value="I\nBase" align="center" color="white" width="0.8" position="0 0.03 0.02"></a-text></a-entity>

      <a-entity id="seg-J" position="0.1 0.07 0" class="interactive-key seg-key" data-char="J"><a-sphere radius="0.022" color="#8b5cf6"></a-sphere><a-text value="J\nTip" align="center" color="white" width="0.8" position="0 0.03 0.02"></a-text></a-entity>
      <a-entity id="seg-K" position="0.1 0.02 0" class="interactive-key seg-key" data-char="K"><a-sphere radius="0.022" color="#a855f7"></a-sphere><a-text value="K\nMid" align="center" color="white" width="0.8" position="0 0.03 0.02"></a-text></a-entity>
      <a-entity id="seg-L" position="0.1 -0.03 0" class="interactive-key seg-key" data-char="L"><a-sphere radius="0.022" color="#ec4899"></a-sphere><a-text value="L\nBase" align="center" color="white" width="0.8" position="0 0.03 0.02"></a-text></a-entity>
    </a-entity>

    <!-- Camera Rig with WebXR Hand Tracking & 3s Gaze Reticle -->
    <a-entity id="rig" position="0 1.6 0">
      <a-camera id="camera" look-controls="enabled: true">
        <a-cursor id="gaze-cursor"
                  fuse="true"
                  fuse-timeout="3000"
                  raycaster="objects: .interactive-key"
                  position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.008; radiusOuter: 0.014"
                  material="color: #818cf8; shader: flat">
          <a-animation begin="fusing" easing="ease-in" attribute="scale" dur="3000" fill="backwards" from="1 1 1" to="0.15 0.15 0.15"></a-animation>
        </a-cursor>
      </a-camera>

      <!-- WebXR Hands -->
      <a-entity id="left-hand" hand-tracking-controls="hand: left;"></a-entity>
      <a-entity id="right-hand" hand-tracking-controls="hand: right;"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    let typedText = '';
    let passthroughOn = true;
    let audioCtx = null;

    const segmentKeysMap = [
      { id: 'seg-A', char: 'A' }, { id: 'seg-B', char: 'B' }, { id: 'seg-C', char: 'C' },
      { id: 'seg-D', char: 'D' }, { id: 'seg-E', char: 'E' }, { id: 'seg-F', char: 'F' },
      { id: 'seg-G', char: 'G' }, { id: 'seg-H', char: 'H' }, { id: 'seg-I', char: 'I' },
      { id: 'seg-J', char: 'J' }, { id: 'seg-K', char: 'K' }, { id: 'seg-L', char: 'L' }
    ];

    const qwertyRows = [
      ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
      ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
      ['Z', 'X', 'C', 'V', 'B', 'N', 'M']
    ];

    function playBeepSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch (e) { console.warn(e); }
    }

    function buildQwertyKeyboard() {
      const container = document.getElementById('qwerty-keys-container');
      if (!container) return;
      container.innerHTML = '';

      qwertyRows.forEach((row, rowIndex) => {
        const yPos = -rowIndex * 0.15;
        const rowWidth = row.length * 0.14;
        const startX = -rowWidth / 2 + 0.07;

        row.forEach((char, colIndex) => {
          const xPos = startX + colIndex * 0.14;
          const keyEl = document.createElement('a-entity');
          keyEl.setAttribute('id', `qwerty-key-${char}`);
          keyEl.setAttribute('class', 'interactive-key qwerty-key');
          keyEl.setAttribute('position', `${xPos} ${yPos} 0`);
          keyEl.setAttribute('data-char', char);

          const box = document.createElement('a-box');
          box.setAttribute('width', '0.12');
          box.setAttribute('height', '0.12');
          box.setAttribute('depth', '0.03');
          box.setAttribute('color', '#1e293b');
          keyEl.appendChild(box);

          const text = document.createElement('a-text');
          text.setAttribute('value', char);
          text.setAttribute('align', 'center');
          text.setAttribute('color', '#f8fafc');
          text.setAttribute('width', '1.8');
          text.setAttribute('position', '0 0 0.02');
          keyEl.appendChild(text);

          keyEl.addEventListener('click', () => typeChar(char));
          container.appendChild(keyEl);
        });
      });
    }

    function highlightQwertyKey(char) {
      const keyEl = document.getElementById(`qwerty-key-${char}`);
      if (keyEl) {
        const box = keyEl.querySelector('a-box');
        if (box) {
          const originalColor = box.getAttribute('color');
          box.setAttribute('color', '#818cf8');
          box.setAttribute('scale', '1.1 1.1 1.1');
          setTimeout(() => {
            box.setAttribute('color', originalColor);
            box.setAttribute('scale', '1 1 1');
          }, 300);
        }
      }
    }

    function typeChar(char) {
      typedText += char;
      updateDisplay();
      playBeepSound();
      if (char !== ' ') highlightQwertyKey(char.toUpperCase());
    }

    function handleBackspace() {
      if (typedText.length > 0) {
        typedText = typedText.slice(0, -1);
        updateDisplay();
        playBeepSound();
      }
    }

    function clearText() {
      typedText = '';
      updateDisplay();
    }

    function updateDisplay() {
      document.getElementById('text-output').innerText = typedText;
      const vrText = document.getElementById('vr-text-output');
      if (vrText) vrText.setAttribute('value', 'Output: ' + typedText);
    }

    function togglePassthrough() {
      passthroughOn = !passthroughOn;
      document.getElementById('passthru-label').innerText = passthroughOn ? 'ON' : 'OFF';
      const scene = document.querySelector('a-scene');
      if (passthroughOn) {
        scene.setAttribute('background', 'transparent: true');
      } else {
        scene.setAttribute('background', 'color: #090d16');
      }
    }

    window.addEventListener('keydown', (e) => {
      const key = e.key.toUpperCase();
      if (key >= 'A' && key <= 'Z' && key.length === 1) typeChar(key);
      else if (e.key === ' ') typeChar(' ');
      else if (e.key === 'Backspace') handleBackspace();
    });

    window.addEventListener('DOMContentLoaded', () => {
      buildQwertyKeyboard();
      segmentKeysMap.forEach(key => {
        const segEl = document.getElementById(key.id);
        if (segEl) segEl.addEventListener('click', () => typeChar(key.char));
      });
    });
  </script>
</body>
</html>
