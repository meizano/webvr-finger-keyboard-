<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Native WebXR Hand-Tracking 12-Button Keyboard</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .ui-overlay {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(15, 23, 42, 0.9);
      padding: 12px 24px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    button {
      background: #6366f1;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <div class="ui-overlay">
    <span>Native WebXR Hand Tracking Mode</span>
    <button onclick="clearText()">Clear Text</button>
    <button onclick="window.location.href='index.html'">Back to Menu</button>
  </div>

  <a-scene webxr="optionalFeatures: hand-tracking, hit-test, local-floor" background="color: #090d16">
    <a-assets>
      <mixin id="key-marker" geometry="primitive: sphere; radius: 0.015" material="shader: flat; color: #6366f1"></mixin>
    </a-assets>

    <!-- Environment -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; color: #818cf8; intensity: 0.6" position="1 4 2"></a-entity>

    <!-- Floating Text Output in VR -->
    <a-entity position="0 1.8 -1.5">
      <a-plane width="1.8" height="0.6" color="#1e293b" opacity="0.9" position="0 0 0"></a-plane>
      <a-text id="vr-output" value="Output: " align="center" color="#818cf8" width="3.5" position="0 0 0.02" font="dejavu"></a-text>
      <a-text value="Pinch thumb to index/fingers to type A-L" align="center" color="#94a3b8" width="3" position="0 -0.4 0.02" font="dejavu" scale="0.8 0.8 0.8"></a-text>
    </a-entity>

    <!-- Back to menu 3D button -->
    <a-entity position="0 1.0 -1.5" class="clickable" onclick="window.location.href='index.html'">
      <a-box width="0.8" height="0.3" depth="0.05" color="#ef4444"></a-box>
      <a-text value="Back" align="center" color="white" width="2" position="0 0 0.03"></a-text>
    </a-entity>

    <!-- Camera Rig with Hand Tracking Controls -->
    <a-entity id="rig" position="0 1.6 0">
      <a-camera></a-camera>
      <!-- Left Hand -->
      <a-entity id="left-hand" hand-tracking-controls="hand: left;"></a-entity>
      <!-- Right Hand with Custom Buttons -->
      <a-entity id="right-hand" hand-tracking-controls="hand: right;">
        <!-- 12 Segment Key indicators attached to right hand -->
        <a-entity id="key-A" position="0 0 0"><a-sphere radius="0.012" color="#ef4444"></a-sphere><a-text value="A" position="0 0.02 0" align="center" color="white" width="0.8"></a-text></a-entity>
        <a-entity id="key-B" position="0 0 0"><a-sphere radius="0.012" color="#f97316"></a-sphere><a-text value="B" position="0 0.02 0" align="center" color="white" width="0.8"></a-text></a-entity>
        <a-entity id="key-C" position="0 0 0"><a-sphere radius="0.012" color="#facc15"></a-sphere><a-text value="C" position="0 0.02 0" align="center" color="white" width="0.8"></a-text></a-entity>
        <a-entity id="key-D" position="0 0 0"><a-sphere radius="0.012" color="#22c55e"></a-sphere><a-text value="D" position="0 0.02 0" align="center" color="white" width="0.8"></a-text></a-entity>
        <a-entity id="key-E" position="0 0 0"><a-sphere radius="0.012" color="#10b981"></a-sphere><a-text value="E" position="0 0.02 0" align="center" color="white" width="0.8"></a-text></a-entity>
        <a-entity id="key-F" position="0 0 0"><a-sphere radius="0.012" color="#14b8a6"></a-sphere><a-text value="F" position="0 0.02 0" align="center" color="white" width="0.8"></a-text></a-entity>
        <a-entity id="key-G" position="0 0 0"><a-sphere radius="0.012" color="#06b6d4"></a-sphere><a-text value="G" position="0 0.02 0" align="center" color="white" width="0.8"></a-text></a-entity>
        <a-entity id="key-H" position="0 0 0"><a-sphere radius="0.012" color="#3b82f6"></a-sphere><a-text value="H" position="0 0.02 0" align="center" color="white" width="0.8"></a-text></a-entity>
        <a-entity id="key-I" position="0 0 0"><a-sphere radius="0.012" color="#6366f1"></a-sphere><a-text value="I" position="0 0.02 0" align="center" color="white" width="0.8"></a-text></a-entity>
        <a-entity id="key-J" position="0 0 0"><a-sphere radius="0.012" color="#8b5cf6"></a-sphere><a-text value="J" position="0 0.02 0" align="center" color="white" width="0.8"></a-text></a-entity>
        <a-entity id="key-K" position="0 0 0"><a-sphere radius="0.012" color="#a855f7"></a-sphere><a-text value="K" position="0 0.02 0" align="center" color="white" width="0.8"></a-text></a-entity>
        <a-entity id="key-L" position="0 0 0"><a-sphere radius="0.012" color="#ec4899"></a-sphere><a-text value="L" position="0 0.02 0" align="center" color="white" width="0.8"></a-text></a-entity>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    let typedText = '';

    function clearText() {
      typedText = '';
      updateOutput();
    }

    function updateOutput() {
      const el = document.getElementById('vr-output');
      if (el) el.setAttribute('value', 'Output: ' + typedText);
    }

    // WebXR Hand tracking interaction simulation / monitoring
    AFRAME.registerComponent('hand-keyboard', {
      tick: function () {
        // In native WebXR, hand joints can be queried if available from the hand object
        const rightHandEl = document.getElementById('right-hand');
        if (rightHandEl && rightHandEl.object3D) {
          // Hand joints tracking if supported by XRHand
        }
      }
    });

    document.querySelectorAll('.clickable').forEach(el => {
      el.addEventListener('click', (e) => {
        const href = e.currentTarget.getAttribute('onclick');
        if (href) {
          const match = href.match(/'([^']+)'/);
          if (match && match[1]) window.location.href = match[1];
        }
      });
    });
  </script>
</body>
</html>
